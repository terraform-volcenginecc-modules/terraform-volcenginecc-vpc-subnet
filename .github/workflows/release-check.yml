name: Release check

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Validate module and examples
        run: ./scripts/validate.sh

      - name: Validate real-cloud fixture statically
        run: ./tests/validate.sh

      - name: Verify release files
        run: |
          test -s README.md
          test -s CHANGELOG.md
          test -s LICENSE
          for example in basic complete; do
            grep -Eq 'source[[:space:]]*=[[:space:]]*"volcengine/vpc-subnet/volcenginecc"' "examples/${example}/main.tf"
            grep -Eq 'version[[:space:]]*=[[:space:]]*"~> 1.0"' "examples/${example}/main.tf"
          done
